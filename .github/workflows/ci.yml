name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Tests (dont contrat OpenAPI)
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage

  frontend:
    name: PWA (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/HomeBudget.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/HomeBudget.Web/package-lock.json
      - run: npm ci
      - name: Client API à jour
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_SETUP_TOKEN: ci-e2e-token
    steps:
      - uses: actions/checkout@v5
      - name: Image Docker
        run: docker build -t home-budget:ci .
      - name: Démarrage du conteneur (volume vide)
        run: |
          docker run -d --name home-budget -p 8080:8080 \
            -e HB__SetupToken=$E2E_SETUP_TOKEN \
            -e HB__Security__AllowInsecureHttp=true \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            home-budget:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/ready && exit 0; sleep 2; done
          docker logs home-budget; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs du conteneur
        if: failure()
        run: docker logs home-budget
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
