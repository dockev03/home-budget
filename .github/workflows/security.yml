name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4

  trivy:
    name: Trivy (fichiers et image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      # ⚠ trivy-action a subi une compromission de ses tags en mars 2026 (CVE-2026-33634) :
      # v0.35.0 est la version saine, à épingler par SHA complet. Binaire Trivy figé en v0.69.3.
      - name: Scan des dépendances et de la configuration
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Image Docker
        run: docker build -t home-budget:scan .
      - name: Scan de l'image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          image-ref: home-budget:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Revue des dépendances
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
