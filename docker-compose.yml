# Stack Portainer (« Repository » ou « Web editor ») ou `docker compose up -d`.
# L'image est tirée de GHCR (paquet privé) : déclarer le registre ghcr.io dans Portainer
# (Registries) ou faire `docker login ghcr.io` avec un jeton GitHub `read:packages`.
# Variables à renseigner dans Portainer (onglet « Environment variables ») ou dans un fichier .env :
#   HB_VERSION             version de l'image, ex. 0.2.0 (défaut : latest ; épingler en production)
#   HB_PUBLIC_URL          URL publique, ex. https://budget.mondomaine.fr
#   HB_KNOWN_PROXY_NETWORK sous-réseau du réseau Docker du NPM, ex. 172.20.0.0/16
#                          (docker network inspect <réseau> → IPAM.Config.Subnet)
#   NPM_NETWORK            nom du réseau Docker du Nginx Proxy Manager (défaut : npm_default)
# Dans le NPM : Proxy Host → hôte « home-budget », port 8080, SSL forcé, HSTS activé.

services:
  home-budget:
    image: ghcr.io/dockev03/home-budget:${HB_VERSION:-latest}
    container_name: home-budget
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      HB__PublicUrl: ${HB_PUBLIC_URL:-}
      HB__KnownProxyNetwork: ${HB_KNOWN_PROXY_NETWORK:-}
    volumes:
      - home-budget-data:/data
    networks:
      - npm
    # Aucun port publié : seul le NPM joint le conteneur, via le réseau Docker.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  home-budget-data:

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
