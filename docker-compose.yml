# Stack Portainer (« Repository » ou « Web editor ») ou `docker compose up -d`.
# L'image est tirée de GHCR (paquet privé) : déclarer le registre ghcr.io dans Portainer
# (Registries) ou faire `docker login ghcr.io` avec un jeton GitHub `read:packages`.
# Variables à renseigner dans Portainer (onglet « Environment variables ») ou dans un fichier .env :
#   HB_VERSION             version de l'image, ex. 0.2.0 (défaut : latest ; épingler en production)
#   HB_PUBLIC_URL          URL publique, ex. https://budget.mondomaine.fr
#   HB_KNOWN_PROXY_NETWORK sous-réseau du réseau Docker du NPM, ex. 172.20.0.0/16
#                          (docker network inspect <réseau> → IPAM.Config.Subnet)
#   HB_VAPID_PUBLIC_KEY / HB_VAPID_PRIVATE_KEY  clés des notifications push (facultatif) :
#                          docker run --rm ghcr.io/dockev03/home-budget:<version> --generate-vapid-keys
#   HB_SMTP_HOST / HB_SMTP_PORT / HB_SMTP_USER / HB_SMTP_PASSWORD / HB_SMTP_FROM
#                          résumé par e-mail (facultatif), ex. smtp.gmail.com, 587, mot de passe d'application
#   HB_LOGIN_HISTORY_RETENTION_DAYS  conservation de l'historique des connexions, en jours
#                          (facultatif ; défaut 0 : illimitée), ex. 365
#   NPM_NETWORK            nom du réseau Docker du Nginx Proxy Manager (défaut : npm_default)
# Dans le NPM : Proxy Host → hôte « home-budget », port 8080, SSL forcé, HSTS activé.

services:
  home-budget:
    image: ghcr.io/dockev03/home-budget:${HB_VERSION:-latest}
    container_name: home-budget
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      HB__PublicUrl: ${HB_PUBLIC_URL:-}
      HB__KnownProxyNetwork: ${HB_KNOWN_PROXY_NETWORK:-}
      # Notifications (facultatif) : push si les deux clés VAPID sont renseignées, e-mail si l'hôte SMTP l'est.
      HB__Push__VapidPublicKey: ${HB_VAPID_PUBLIC_KEY:-}
      HB__Push__VapidPrivateKey: ${HB_VAPID_PRIVATE_KEY:-}
      HB__Smtp__Host: ${HB_SMTP_HOST:-}
      HB__Smtp__Port: ${HB_SMTP_PORT:-587}
      HB__Smtp__User: ${HB_SMTP_USER:-}
      HB__Smtp__Password: ${HB_SMTP_PASSWORD:-}
      HB__Smtp__From: ${HB_SMTP_FROM:-}
      # Historique des connexions au journal d'audit : 0 = conservation illimitée.
      HB__Security__LoginHistoryRetentionDays: ${HB_LOGIN_HISTORY_RETENTION_DAYS:-0}
    volumes:
      - home-budget-data:/data
    networks:
      - npm
    # Aucun port publié : seul le NPM joint le conteneur, via le réseau Docker.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  home-budget-data:

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
